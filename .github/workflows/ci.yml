name: CI Pipeline
on: [pull_request]
jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash Syntax
        run: |
          bash -n check_api.sh
          bash -n analyze_logs.sh
  test-monitoring:
    runs-on: ubuntu-latest
    needs: syntax-check
    steps:
      - uses: actions/checkout@v4
      - name: Test check_api.sh
        run: |
          chmod +x check_api.sh
          ./check_api.sh https://httpbin.org/status/200